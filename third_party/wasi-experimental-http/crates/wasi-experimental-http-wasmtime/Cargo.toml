[package]
    name        = "wasi-experimental-http-wasmtime"
    version     = "0.10.0"
    authors     = [ "Radu Matei <radu.matei@microsoft.com>" ]
    edition     = "2021"
    repository  = "https://github.com/deislabs/wasi-experimental-http"
    license     = "MIT"
    description = "Experimental HTTP library for WebAssembly in Wasmtime"
    readme      = "readme.md"

[dependencies]
    anyhow = "1.0"
    bytes = "1"
    futures = "0.3"
    http = "0.2"
    reqwest = { version = "0.11", default-features = true, features = [
        "json",
        "blocking",
    ] }
    thiserror = "1.0"
    tokio = { version = "1", features = [ "full" ] }
    tracing = { version = "0.1", features = [ "log" ] }
    url = "2"
    # Vendored from upstream which had `wasmtime = "*"` — that breaks
    # fresh resolves now that wasmtime 44 exists, since this crate's
    # source only compiles against wasmtime 14.
    wasmtime = "14"
    wasmtime-wasi = "14"
    wasi-common = "14"
