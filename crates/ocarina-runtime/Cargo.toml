[package]
name = "ocarina-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Shippable runtime engine: asset archive loader + ECS tick + render + audio. Must NOT depend on editor crates."

[dependencies]
ocarina-rhi.workspace = true
ocarina-core.workspace = true
ocarina-scene.workspace = true
ocarina-gameplay-api.workspace = true
bevy_ecs.workspace = true
bincode.workspace = true
log.workspace = true
glam.workspace = true

# Windowed mode (winit + wgpu + render loop). Optional so headless
# users — tests, the editor's in-process tick loop, CI smokes —
# don't pay the cost of pulling in winit/wgpu.
winit      = { workspace = true, optional = true }
wgpu       = { workspace = true, optional = true }
pollster   = { workspace = true, optional = true }
bytemuck   = { workspace = true, optional = true }
anyhow     = { workspace = true, optional = true }

[features]
default = []
windowed = ["dep:winit", "dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:anyhow"]

[lints]
workspace = true
