[package]
name = "ocarina-viewport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Floem-embedded 3D viewport rendering for Ocarina, driving ocarina-rhi-wgpu directly into the editor's swapchain backbuffer via floem::Renderer::submit_wgpu_pass."

[dependencies]
# Floem path dep. Not workspace = true because ocarina-viewport is a
# member of OUR root workspace (which doesn't list floem). Lapce-app's
# Floem is normally git+rev-sourced; the [patch."https://github.com/lapce/floem"]
# in our root Cargo.toml redirects it to the same local third_party/floem,
# preserving type identity across the dep graph.
floem = { path = "../../third_party/floem" }
floem_renderer = { path = "../../third_party/floem/renderer" }

ocarina-rhi.workspace = true
ocarina-rhi-wgpu.workspace = true
ocarina-scene.workspace = true
ocarina-core.workspace = true
# Shared rendering core (lit pipeline + mesh registry + UBO formats).
# `editor` feature on: enables wireframe alt pipeline + unlit
# variant + RenderConfig toggle struct. The runtime crate never
# enables this feature so the shipped binary stays lean.
ocarina-render = { workspace = true, default-features = false, features = ["obj", "editor"] }
# Linking ocarina-physics here brings the Collider / RigidBody /
# Velocity inventory submissions into the editor binary. Without it,
# the scene loader rejects `[collider]` / `[rigid_body]` and the
# surrounding entity loses its Transform too — entities silently
# disappear from the viewport.
#
# `default-features = false` skips rapier; the editor doesn't need
# the solver until "play in editor" lands, just the component types.
ocarina-physics.workspace = true

bevy_ecs.workspace = true
glam.workspace = true
bytemuck.workspace = true
log.workspace = true
wgpu.workspace = true
# toml_edit drives the gizmo's transform write-back: format-preserving
# updates of the `[transform]` section in entity .toml files (so a
# drag in the viewport doesn't reflow comments / surrounding fields).
toml_edit.workspace = true

[lints]
workspace = true
